<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Project Hospital Mods</title>

    <style>
        body {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            line-height: 1.6;
            color: #1f2328;
        }

        .top-link {
            margin-bottom: 24px;
        }

        .markdown-body img {
            max-width: 100%;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
        }

        .markdown-body th,
        .markdown-body td {
            padding: 8px 12px;
            border: 1px solid #d0d7de;
        }

        .error {
            color: #d1242f;
        }
    </style>
</head>

<body>
    <div class="top-link">
        <a href="report.html">
            Report a bug
        </a>
    </div>

    <main
        id="readme"
        class="markdown-body">
        Loading README...
    </main>

    <script>
        async function loadReadme() {
            const container =
                document.getElementById("readme");

            try {
                const response = await fetch(
                    "https://api.github.com/repos/Loupito75/Project-Hospital-Mods/readme",
                    {
                        headers: {
                            "Accept":
                                "application/vnd.github.html+json"
                        }
                    });

                if (!response.ok) {
                    throw new Error(
                        "HTTP " + response.status);
                }

                container.innerHTML =
                    await response.text();
            }
            catch (error) {
                container.className = "error";
                container.textContent =
                    "Unable to load the README.";
            }
        }

        loadReadme();
    </script>
</body>
</html>
