name: Update latest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: update-release-metadata
  cancel-in-progress: false

jobs:
  update-release-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Update README and manifest
        run: python3 .github/scripts/update_latest_release.py

      - name: Check for metadata changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- README.md mod-updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release metadata
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const expectedHeadOid = execSync(
              'git rev-parse HEAD',
              { encoding: 'utf8' }
            ).trim();

            const additions = [
              'README.md',
              'mod-updates.json'
            ].map(path => ({
              path,
              contents: fs.readFileSync(path).toString('base64')
            }));

            const mutation = `
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    url
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner: context.repo.owner + '/' + context.repo.repo,
                  branchName: 'main'
                },
                expectedHeadOid,
                message: {
                  headline: 'Update release metadata',
                  body: 'Generated by GitHub-Actions'
                },
                fileChanges: {
                  additions
                }
              }
            });
