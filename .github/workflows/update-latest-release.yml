name: Update latest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update latest release
        run: python3 .github/scripts/update_latest_release.py

      - name: Check for README changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README through GitHub
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "README.md";
            const branch = "main";

            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: branch
            });

            const content = fs.readFileSync(path, "utf8");

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: current.data.sha,
              message: "Update latest release\n\nGenerated by GitHub-Actions",
              content: Buffer.from(content, "utf8").toString("base64")
            });
