name: Update latest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        type: string

  release:
    types:
      - published

  schedule:
    # Refresh the signed HMUC package catalog once per month.
    # New releases already refresh it automatically.
    - cron: "17 4 1 * *"

permissions:
  contents: read

concurrency:
  group: update-release-metadata
  cancel-in-progress: false

jobs:
  update-release-metadata:
    runs-on: ubuntu-latest

    environment:
      name: hmuc-signing
      deployment: false

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Update release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HMUC_PACKAGE_SIGNING_KEY_B64: ${{ secrets.HMUC_PACKAGE_SIGNING_KEY_B64 }}
        run: |
          python3 .github/scripts/update_latest_release.py

      - name: Check for metadata changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- \
            README.md \
            mod-updates.json \
            mod-packages.json \
            mod-packages.json.sig)" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release metadata
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.RELEASE_METADATA_TOKEN }}

          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const expectedHeadOid = execSync(
              'git rev-parse HEAD',
              { encoding: 'utf8' }
            ).trim();

            const paths = [
              'README.md',
              'mod-updates.json',
              'mod-packages.json',
              'mod-packages.json.sig'
            ];

            const additions = paths
              .filter(path => fs.existsSync(path))
              .map(path => ({
                path,
                contents: fs
                  .readFileSync(path)
                  .toString('base64')
              }));

            const mutation = `
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    url
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner:
                    context.repo.owner +
                    '/' +
                    context.repo.repo,

                  branchName: 'main'
                },

                expectedHeadOid,

                message: {
                  headline: 'Update release metadata',
                  body: 'Generated by GitHub-Actions'
                },

                fileChanges: {
                  additions
                }
              }
            });
