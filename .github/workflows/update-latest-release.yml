name: Update latest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: update-release-metadata
  cancel-in-progress: false

jobs:
  update-release-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README and manifest
        run: python3 .github/scripts/update_latest_release.py

      - name: Check for metadata changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- README.md mod-updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release metadata
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md mod-updates.json
          git commit -m "Update release metadata" -m "Generated by GitHub-Actions"
          git push origin HEAD:main
