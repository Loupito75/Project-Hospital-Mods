name: Update latest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        type: string

  release:
    types:
      - published

  schedule:
    # Refresh the signed HMUC package catalog once per month.
    # New releases already refresh it automatically.
    - cron: "17 4 1 * *"

permissions:
  contents: read

concurrency:
  group: update-release-metadata
  cancel-in-progress: false

jobs:
  update-release-metadata:
    runs-on: ubuntu-24.04

    environment:
      name: hmuc-signing
      deployment: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Update release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HMUC_PACKAGE_SIGNING_KEY_B64: ${{ secrets.HMUC_PACKAGE_SIGNING_KEY_B64 }}
        run: |
          python3 .github/scripts/update_latest_release.py

      - name: Check for metadata changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- \
            README.md \
            mod-updates.json \
            mod-packages.json \
            mod-packages.json.sig)" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release metadata through pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.RELEASE_METADATA_TOKEN }}

          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const sleep = milliseconds =>
              new Promise(
                resolve => setTimeout(resolve, milliseconds)
              );

            const mainHeadOid = execSync(
              'git rev-parse HEAD',
              { encoding: 'utf8' }
            ).trim();

            const branchName =
              'automation/release-metadata-' +
              process.env.GITHUB_RUN_ID +
              '-' +
              process.env.GITHUB_RUN_ATTEMPT;

            let merged = false;
            let pullNumber = null;

            const paths = [
              'README.md',
              'mod-updates.json',
              'mod-packages.json',
              'mod-packages.json.sig'
            ];

            const additions = paths
              .filter(path => fs.existsSync(path))
              .map(path => ({
                path,
                contents: fs
                  .readFileSync(path)
                  .toString('base64')
              }));

            core.info(
              `Creating automation branch ${branchName} from ${mainHeadOid}`
            );

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branchName}`,
              sha: mainHeadOid
            });

            try {
              const mutation = `
                mutation($input: CreateCommitOnBranchInput!) {
                  createCommitOnBranch(input: $input) {
                    commit {
                      oid
                      url
                    }
                  }
                }
              `;

              const commitResult = await github.graphql(
                mutation,
                {
                  input: {
                    branch: {
                      repositoryNameWithOwner:
                        owner + '/' + repo,
                      branchName
                    },

                    expectedHeadOid: mainHeadOid,

                    message: {
                      headline: 'Update release metadata',
                      body: 'Generated by GitHub-Actions'
                    },

                    fileChanges: {
                      additions
                    }
                  }
                }
              );

              core.info(
                `Created metadata commit ${commitResult.createCommitOnBranch.commit.oid}`
              );

              const pull = await github.rest.pulls.create({
                owner,
                repo,
                head: branchName,
                base: 'main',
                title: 'Update release metadata',
                body:
                  'Automated release metadata update.\n\n' +
                  'Generated by GitHub-Actions'
              });

              pullNumber = pull.data.number;

              core.info(
                `Created pull request #${pull.data.number}`
              );

              let expectedBaseOid = mainHeadOid;
              let lastMergeError = null;

              for (let attempt = 1; attempt <= 5; attempt++) {
                if (attempt === 1) {
                  // GitHub can briefly report a freshly-created PR as
                  // stale even when main has not actually changed.
                  await sleep(2000);
                }

                try {
                  const merge = await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pull.data.number,
                    merge_method: 'squash',
                    commit_title: 'Update release metadata',
                    commit_message: 'Generated by GitHub-Actions'
                  });

                  if (!merge.data.merged) {
                    throw new Error(
                      'Pull request was not merged: ' +
                      (merge.data.message || 'unknown reason')
                    );
                  }

                  merged = true;

                  core.info(
                    `Merged pull request #${pull.data.number}`
                  );

                  break;
                }
                catch (error) {
                  lastMergeError = error;

                  const message =
                    error.response &&
                    error.response.data &&
                    error.response.data.message
                      ? error.response.data.message
                      : error.message || '';

                  const baseRace =
                    error.status === 405 &&
                    message.indexOf(
                      'Base branch was modified'
                    ) >= 0;

                  if (!baseRace) {
                    throw error;
                  }

                  core.warning(
                    `Merge attempt ${attempt} hit a base-branch race: ${message}`
                  );

                  const mainRef = await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: 'heads/main'
                  });

                  const currentBaseOid =
                    mainRef.data.object.sha;

                  if (currentBaseOid !== expectedBaseOid) {
                    const currentPull =
                      await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number: pull.data.number
                      });

                    core.info(
                      `Updating pull request #${pull.data.number} ` +
                      `from base ${expectedBaseOid} to ${currentBaseOid}`
                    );

                    await github.request(
                      'PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                      {
                        owner,
                        repo,
                        pull_number: pull.data.number,
                        expected_head_sha:
                          currentPull.data.head.sha
                      }
                    );

                    expectedBaseOid = currentBaseOid;
                  }
                  else {
                    core.info(
                      'The base SHA did not actually change; ' +
                      'waiting for GitHub to refresh pull request mergeability.'
                    );
                  }

                  if (attempt < 5) {
                    await sleep(2000);
                  }
                }
              }

              if (!merged) {
                throw lastMergeError ||
                  new Error(
                    'Pull request could not be merged after retries.'
                  );
              }
            }
            finally {
              if (merged) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`
                  });

                  core.info(
                    `Deleted automation branch ${branchName}`
                  );
                }
                catch (error) {
                  core.warning(
                    `Could not delete automation branch ${branchName}: ${error.message}`
                  );
                }
              }
              else {
                core.warning(
                  `Leaving automation branch ${branchName}` +
                  (pullNumber !== null
                    ? ` and pull request #${pullNumber}`
                    : '') +
                  ' intact for review.'
                );
              }
            }
