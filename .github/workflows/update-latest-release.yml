name: Update latest release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual action"
        required: true
        default: "single-release"
        type: choice
        options:
          - single-release
          - rebuild-package-catalog
          - refresh-catalog

      tag:
        description: "Release tag (required only for single-release)"
        required: false
        type: string

  release:
    types:
      - published

  push:
    branches:
      - main
    paths:
      - "catalog/source/catalog-control.json"
      - "catalog/source/news.json"

  schedule:
    # Existing monthly signed-catalog refresh.
    - cron: "17 4 1 * *"
    # Daily lightweight policy check. This performs the 2026-12-01 legacy
    # deletion automatically, while avoiding a daily legacy catalog reseal.
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: update-release-metadata
  cancel-in-progress: false

jobs:
  update-release-metadata:
    runs-on: ubuntu-24.04

    environment:
      name: hmuc-signing
      deployment: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Read unified catalog switch
        id: catalog-control
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("catalog/source/catalog-control.json")
          value = json.loads(path.read_text(encoding="utf-8"))

          active = value.get("unifiedCatalogActive")

          if type(active) is not bool:
              raise SystemExit(
                  "unifiedCatalogActive must be true or false"
              )

          print("active=" + ("true" if active else "false"))
          PY

      - name: Update established legacy metadata
        if: >-
          steps.catalog-control.outputs.active != 'true' &&
          github.event_name != 'push' &&
          (
            github.event_name != 'schedule' ||
            github.event.schedule == '17 4 1 * *'
          ) &&
          (
            github.event_name != 'workflow_dispatch' ||
            inputs.mode != 'refresh-catalog'
          )
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HMUC_PACKAGE_SIGNING_KEY_B64: ${{ secrets.HMUC_PACKAGE_SIGNING_KEY_B64 }}
        run: |
          python3 .github/scripts/update_latest_release.py

      - name: Build unified catalog and apply legacy policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HMUC_PACKAGE_SIGNING_KEY_B64: ${{ secrets.HMUC_PACKAGE_SIGNING_KEY_B64 }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 .github/scripts/update_unified_catalog.py

      - name: Check for generated changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- \
            README.md \
            catalog/mod-catalog.json \
            catalog/mod-catalog.json.sig \
            mod-updates.json \
            mod-packages.json \
            mod-packages.json.sig \
            mod-details.json \
            mod-details.json.sig \
            mod-news.json)" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish generated metadata through pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.RELEASE_METADATA_TOKEN }}

          script: |
            const fs = require('fs');
            const { execFileSync, execSync } = require('child_process');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const sleep = milliseconds =>
              new Promise(
                resolve => setTimeout(resolve, milliseconds)
              );

            const mainHeadOid = execSync(
              'git rev-parse HEAD',
              { encoding: 'utf8' }
            ).trim();

            const branchName =
              'automation/release-metadata-' +
              process.env.GITHUB_RUN_ID +
              '-' +
              process.env.GITHUB_RUN_ATTEMPT;

            let merged = false;
            let pullNumber = null;

            const paths = [
              'README.md',
              'catalog/mod-catalog.json',
              'catalog/mod-catalog.json.sig',
              'mod-updates.json',
              'mod-packages.json',
              'mod-packages.json.sig',
              'mod-details.json',
              'mod-details.json.sig',
              'mod-news.json'
            ];

            const statusFor = path =>
              execFileSync(
                'git',
                ['status', '--porcelain', '--', path],
                { encoding: 'utf8' }
              ).trim();

            const trackedAtHead = path =>
              execFileSync(
                'git',
                ['ls-files', '--', path],
                { encoding: 'utf8' }
              ).trim().length > 0;

            const additions = [];
            const deletions = [];

            for (const path of paths) {
              const status = statusFor(path);

              if (!status) {
                continue;
              }

              if (fs.existsSync(path)) {
                additions.push({
                  path,
                  contents: fs
                    .readFileSync(path)
                    .toString('base64')
                });
              }
              else if (trackedAtHead(path)) {
                deletions.push({ path });
              }
            }

            if (additions.length === 0 && deletions.length === 0) {
              core.info('No publishable generated changes remain.');
              return;
            }

            core.info(
              `Creating automation branch ${branchName} from ${mainHeadOid}`
            );

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branchName}`,
              sha: mainHeadOid
            });

            try {
              const mutation = `
                mutation($input: CreateCommitOnBranchInput!) {
                  createCommitOnBranch(input: $input) {
                    commit {
                      oid
                      url
                    }
                  }
                }
              `;

              const fileChanges = {};

              if (additions.length > 0) {
                fileChanges.additions = additions;
              }

              if (deletions.length > 0) {
                fileChanges.deletions = deletions;
              }

              const commitResult = await github.graphql(
                mutation,
                {
                  input: {
                    branch: {
                      repositoryNameWithOwner:
                        owner + '/' + repo,
                      branchName
                    },

                    expectedHeadOid: mainHeadOid,

                    message: {
                      headline: 'Update release metadata',
                      body: 'Generated by GitHub-Actions'
                    },

                    fileChanges
                  }
                }
              );

              core.info(
                `Created metadata commit ${commitResult.createCommitOnBranch.commit.oid}`
              );

              const pull = await github.rest.pulls.create({
                owner,
                repo,
                head: branchName,
                base: 'main',
                title: 'Update release metadata',
                body:
                  'Automated release metadata update.\n\n' +
                  'Generated by GitHub-Actions'
              });

              pullNumber = pull.data.number;

              core.info(
                `Created pull request #${pull.data.number}`
              );

              let expectedBaseOid = mainHeadOid;
              let lastMergeError = null;

              for (let attempt = 1; attempt <= 5; attempt++) {
                if (attempt === 1) {
                  await sleep(2000);
                }

                try {
                  const merge = await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pull.data.number,
                    merge_method: 'squash',
                    commit_title: 'Update release metadata',
                    commit_message: 'Generated by GitHub-Actions'
                  });

                  if (!merge.data.merged) {
                    throw new Error(
                      'Pull request was not merged: ' +
                      (merge.data.message || 'unknown reason')
                    );
                  }

                  merged = true;

                  core.info(
                    `Merged pull request #${pull.data.number}`
                  );

                  break;
                }
                catch (error) {
                  lastMergeError = error;

                  const message =
                    error.response &&
                    error.response.data &&
                    error.response.data.message
                      ? error.response.data.message
                      : error.message || '';

                  const baseRace =
                    error.status === 405 &&
                    message.indexOf(
                      'Base branch was modified'
                    ) >= 0;

                  if (!baseRace) {
                    throw error;
                  }

                  core.warning(
                    `Merge attempt ${attempt} hit a base-branch race: ${message}`
                  );

                  const mainRef = await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: 'heads/main'
                  });

                  const currentBaseOid =
                    mainRef.data.object.sha;

                  if (currentBaseOid !== expectedBaseOid) {
                    const currentPull =
                      await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number: pull.data.number
                      });

                    core.info(
                      `Updating pull request #${pull.data.number} ` +
                      `from base ${expectedBaseOid} to ${currentBaseOid}`
                    );

                    await github.request(
                      'PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                      {
                        owner,
                        repo,
                        pull_number: pull.data.number,
                        expected_head_sha:
                          currentPull.data.head.sha
                      }
                    );

                    expectedBaseOid = currentBaseOid;
                  }
                  else {
                    core.info(
                      'The base SHA did not actually change; ' +
                      'waiting for GitHub to refresh pull request mergeability.'
                    );
                  }

                  if (attempt < 5) {
                    await sleep(2000);
                  }
                }
              }

              if (!merged) {
                throw lastMergeError ||
                  new Error(
                    'Pull request could not be merged after retries.'
                  );
              }
            }
            finally {
              if (merged) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`
                  });

                  core.info(
                    `Deleted automation branch ${branchName}`
                  );
                }
                catch (error) {
                  core.warning(
                    `Could not delete automation branch ${branchName}: ${error.message}`
                  );
                }
              }
              else {
                core.warning(
                  `Leaving automation branch ${branchName}` +
                  (pullNumber !== null
                    ? ` and pull request #${pullNumber}`
                    : '') +
                  ' intact for review.'
                );
              }
            }
